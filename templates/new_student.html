{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Add Student</h2>
    <form method="POST">
        <p><label>Student Name</label><br><input type="text" name="name" required></p>
        <p><label>Roll Number</label><br><input type="text" name="roll_number" required></p>
        <button type="submit" class="btn">Add Student</button>
    </form>
</div>
{% endblock %}
